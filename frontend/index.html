<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BIST ve küresel piyasalar için risk analizi, portföy oluşturma, varlık dağılımı ve performans takibi — gerçek Yahoo Finance verisiyle."
    />
    <meta name="theme-color" content="#f4f5f7" />
    <!-- Preconnect + a real <link rel="stylesheet"> instead of index.css's old @import —
         @import is render-blocking in a strictly serial way (fetch index.css, parse it,
         only then discover and fetch the Google Fonts CSS, only then discover and fetch
         the actual font files). This lets the browser open the connection to both Google
         Fonts hosts in parallel with the main CSS/JS fetch instead of after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- PWA installability on iOS Safari, which ignores the web manifest's own
         display:"standalone" and only honors this legacy meta tag. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Finansal Risk & Portföy Analiz Platformu</title>
    <script>
      // Applied before React mounts (and before index.css paints) so the resolved theme
      // doesn't flash a different one for a frame on load — kept as a tiny inline script
      // rather than a module import specifically so it runs synchronously, blocking, before
      // first paint. Mirrors the fallback default in src/lib/ThemeContext.tsx: light unless
      // the user has explicitly chosen dark before (via the topbar toggle, persisted here).
      try {
        var theme = localStorage.getItem('pa_theme')
        if (theme !== 'dark') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
