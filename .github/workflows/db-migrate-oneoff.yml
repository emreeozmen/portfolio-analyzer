name: DB migrate (one-off)

# ONE-OFF: copies the entire database (schema + data) from the DATABASE_URL secret
# to the MIGRATE_DEST_URL secret using pg_dump | pg_restore on a GitHub runner, so no
# local PostgreSQL client is needed. Used once to move off Render's free Postgres
# (deleted 2026-09-24) onto Supabase's free tier.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL     - source. Render: the database -> Connect -> External ->
#                      "External Database URL". (Also used by db-backup.yml; after
#                      the cutover, repoint this one at Supabase too.)
#   MIGRATE_DEST_URL - destination. Supabase: Project -> Connect -> Session pooler
#                      (port 5432) URI, password percent-encoded. DELETE this secret
#                      and this file once the migration is verified.
#
# Run once with "run_migration = true" to do the dump/restore. Every run (with the
# input left false) does a read-only row-count comparison of the two databases —
# safe to re-run any time. Re-running the dump/restore into an already-populated
# destination would duplicate rows, which is why it's behind an explicit flag.

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Actually perform the pg_dump | pg_restore (leave false to only verify)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-migrate-oneoff
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.run_migration }}
    name: pg_dump source | pg_restore into dest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGSSLMODE: require
    steps:
      - name: Install PostgreSQL client 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # The runner already ships postgresql-client-16, and /usr/bin/pg_dump is a
          # pg_wrapper that keeps resolving to 16 — which refuses to dump an 18
          # server. Put the real v18 binaries first on PATH for later steps.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Check both secrets are present
        env:
          SRC: ${{ secrets.DATABASE_URL }}
          DST: ${{ secrets.MIGRATE_DEST_URL }}
        run: |
          if [ -z "$SRC" ] || [ -z "$DST" ]; then
            echo "::error::Set both DATABASE_URL and MIGRATE_DEST_URL repository secrets first."
            exit 1
          fi

      - name: Dump source database
        env:
          SRC: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pg_dump --dbname="$SRC" --format=custom --no-owner --no-privileges --file=migrate.dump
          echo "Dump size: $(stat -c%s migrate.dump) bytes"
          pg_restore --list migrate.dump | grep -E 'TABLE DATA|SEQUENCE' | head -n 50 || true

      - name: Restore into destination database
        env:
          DST: ${{ secrets.MIGRATE_DEST_URL }}
        run: |
          set -euo pipefail
          # --no-owner / --no-privileges: land everything as the Supabase role, don't
          # try to reassign ownership. A few "already exists" notices for the public
          # schema are normal on a DB that isn't bone-empty, so tolerate a non-zero
          # exit here and rely on the verify job below.
          pg_restore --no-owner --no-privileges --no-comments \
            --dbname="$DST" migrate.dump || echo "pg_restore reported non-zero (often just pre-existing objects) — the verify job checks the result."

  verify:
    name: Compare row counts (read-only, always runs)
    runs-on: ubuntu-latest
    needs: [migrate]
    if: ${{ always() }}
    timeout-minutes: 10
    env:
      PGSSLMODE: require
    steps:
      - name: Install psql (client 18)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Row-count diff
        env:
          SRC: ${{ secrets.DATABASE_URL }}
          DST: ${{ secrets.MIGRATE_DEST_URL }}
        run: |
          set -euo pipefail
          Q="SELECT table_name || '=' ||
                 (xpath('/row/c/text()',
                        query_to_xml(format('SELECT count(*) AS c FROM public.%I', table_name),
                                     false, true, '')))[1]::text
             FROM information_schema.tables
             WHERE table_schema='public' AND table_type='BASE TABLE'
             ORDER BY table_name;"
          psql "$SRC" -Atqc "$Q" > src_counts.txt
          psql "$DST" -Atqc "$Q" > dst_counts.txt
          echo "=== SOURCE (Render) ===" && cat src_counts.txt
          echo "=== DEST (Supabase) ===" && cat dst_counts.txt
          if diff -u src_counts.txt dst_counts.txt; then
            echo "OK - every table's row count matches. Migration verified."
          else
            echo "::error::Row counts differ between source and destination (see diff above)."
            exit 1
          fi
