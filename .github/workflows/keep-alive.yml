name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes of no requests, and the
# next real request then pays a 30-60s+ cold-start cost — this is what made the
# deployed site feel "stuck" after an idle period. Pinging the lightweight /health
# endpoint (no DB/external calls) every 10 minutes keeps the instance warm so real
# visitors don't hit that cold start. Free on GitHub's shared runners; remove this
# workflow if the backend ever moves to a plan that doesn't spin down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # max-time comfortably covers a real cold start (observed ~70s) — a run that
        # gives up too early reports failure even though the ping still woke the
        # instance up, which makes the workflow's own status misleading.
        run: curl -fsS --max-time 100 https://portfolio-analyzer-backend-fys1.onrender.com/health
