name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes of no requests, and the
# next real request then pays a 30-60s+ cold-start cost — this is what makes the
# deployed site feel "stuck" after an idle period.
#
# This workflow is a BEST-EFFORT BACKUP, not the primary keep-alive. GitHub Actions
# `schedule` events are low priority and heavily throttled: this job is configured to
# run every 10 minutes but in practice fires anywhere from ~20 minutes to several
# hours apart (and is skipped entirely during high-load periods), so on its own it
# does NOT reliably keep the instance warm.
#
# The primary keep-alive is an external uptime monitor (UptimeRobot) hitting the same
# /health endpoint every 5 minutes, which also alerts if the backend is actually down.
# Keep this workflow as a zero-cost extra ping (public repo = unlimited Actions
# minutes); remove it, and the UptimeRobot monitor, if the backend ever moves to a
# plan that doesn't spin down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # max-time comfortably covers a real cold start (observed ~70s) — a run that
        # gives up too early reports failure even though the ping still woke the
        # instance up, which makes the workflow's own status misleading.
        run: curl -fsS --max-time 100 https://portfolio-analyzer-backend-fys1.onrender.com/health
