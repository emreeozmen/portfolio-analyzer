name: CI

# Runs the backend test suite and the frontend lint / unit tests / production build
# on every push to main and every PR targeting it. This is the automated gate the
# project didn't have before: a change that breaks the tests or the build shows up
# as a red check (and emails whoever pushed) instead of only being discovered after
# it has already deployed. It does NOT run the Playwright e2e suite — those need both
# the frontend dev server and the Python backend running at once (see
# frontend/e2e/ and playwright.config.ts), which isn't worth wiring into CI yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Importing main.py runs Base.metadata.create_all() at module load, so the suite
    # needs a real database. Postgres (not SQLite) on purpose: it's what production
    # runs, so this also exercises the dialect-specific code paths — the kind of
    # difference behind past "worked locally, broke prod" fixes in the history.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pa
          POSTGRES_PASSWORD: pa
          POSTGRES_DB: portfolio_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pa -d portfolio_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://pa:pa@localhost:5432/portfolio_analyzer_test
      # The suite runs against in-memory SQLite fixtures and mocks every network
      # call; this is just long enough to avoid the JWT library's short-key warning.
      JWT_SECRET_KEY: ci-placeholder-secret-ci-placeholder-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9" # keep in sync with render.yaml's PYTHON_VERSION
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install unixODBC runtime (pyodbc is in requirements.txt)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (tsc -b && vite build)
        run: npm run build
