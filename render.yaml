services:
  - type: web
    name: portfolio-analyzer-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Update this after the frontend is deployed to Vercel — must match the real
      # Vercel URL exactly (no trailing slash) or the browser will block API calls.
      - key: CORS_ORIGINS
        value: https://portfolio-analyzer.vercel.app

databases:
  - name: portfolio-analyzer-db
    plan: free
